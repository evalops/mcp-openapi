openapi: 3.1.0
info:
  title: Xquik API
  version: "1.0"
  description: >-
    Xquik is an independent third-party service. Not affiliated with X Corp.
    "Twitter" and "X" are trademarks of X Corp.
externalDocs:
  url: https://docs.xquik.com/api-reference/x/search-tweets
servers:
  - url: https://xquik.com
security:
  - apiKey: []
  - oauthBearer: []
paths:
  /api/v1/x/tweets/search:
    get:
      operationId: searchTweets
      summary: Search tweets by query, Tweet ID, X status URL, or account date window
      tags:
        - Tweets
      security:
        - apiKey: []
        - oauthBearer: []
        - {}
      parameters:
        - name: q
          in: query
          required: true
          description: Search query, post ID, or X status URL.
          schema:
            type: string
        - name: queryType
          in: query
          required: false
          description: Sort order.
          schema:
            type: string
            enum:
              - Latest
              - Top
            default: Latest
        - name: cursor
          in: query
          required: false
          description: Cursor from the previous response.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum posts to return.
          schema:
            type: integer
            default: 20
            maximum: 200
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTweets"
        "400":
          description: Invalid search request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
    oauthBearer:
      type: http
      scheme: bearer
  schemas:
    PaginatedTweets:
      type: object
      required:
        - tweets
        - has_next_page
      properties:
        tweets:
          type: array
          items:
            $ref: "#/components/schemas/Tweet"
        has_next_page:
          type: boolean
        next_cursor:
          type:
            - string
            - "null"
    Tweet:
      type: object
      required:
        - id
        - text
        - author
      properties:
        id:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time
        likeCount:
          type: integer
        retweetCount:
          type: integer
        author:
          $ref: "#/components/schemas/TweetAuthor"
    TweetAuthor:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        verified:
          type: boolean
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
